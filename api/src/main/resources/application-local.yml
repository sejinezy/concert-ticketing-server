spring:
  datasource:
    url: jdbc:mysql://localhost:3306/concert_ticketing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: test1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

management:
  server:
    port: 9091

  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus

server:
  tomcat:
    mbeanregistry:
      enabled: true

external:
  payment:
    base-url: http://localhost:8081

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      payment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - io.github.resilience4j.bulkhead.BulkheadFullException
          - com.ticketing.payment.PaymentNonRetryableException
  retry:
    retry-aspect-order: 2
    instances:
      payment:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - com.ticketing.payment.PaymentRetryableException
        ignore-exceptions:
          - com.ticketing.payment.PaymentNonRetryableException
          - io.github.resilience4j.bulkhead.BulkheadFullException

  bulkhead:
    instances:
      payment:
        max-concurrent-calls: 20
        max-wait-duration: 0

  ratelimiter:
    instances:
      payment:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0
